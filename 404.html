<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Robert Kiptoo</title>
  <meta name="robots" content="noindex">
  <!--
    The host serves this file at whatever URL was missing, so relative paths
    would break here. Styles are inline, and the script below points links at
    the site root: "/" on Netlify or a custom domain, "/<repo>/" on a github.io
    project site. For a <user>.github.io root site, set base to "/" by hand.
  -->
  <script>
    (function () {
      var base = '/';
      if (location.hostname.endsWith('.github.io')) {
        var repo = location.pathname.split('/')[1];
        if (repo) base = '/' + repo + '/';
      }
      var el = document.createElement('base');
      el.href = base;
      document.head.appendChild(el);
    })();
  </script>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
           background: #F6F7F5; color: #15191C; font: 17px/1.6 ui-sans-serif, system-ui, sans-serif; }
    main { max-width: 36rem; }
    h1 { font-size: 2rem; line-height: 1.15; margin: 0 0 12px; }
    a { color: #1F4E5F; font-weight: 500; text-underline-offset: 3px; }
    p { margin: 0 0 16px; }
  </style>
</head>
<body>
  <main>
    <h1>That page doesn't exist.</h1>
    <p>The link may be old, or mistyped. Here's where to go instead:</p>
    <p><a href="./">Home</a> · <a href="work/">See the work</a> · <a href="contact/">Book a 20-min intro</a></p>
  </main>
</body>
</html>
